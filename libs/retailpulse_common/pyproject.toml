[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-common"
version = "0.1.0"
description = "Shared building blocks for RetailPulse services: config, DB, auth, events, cache, observability."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
auth = ["pyjwt>=2.8", "passlib[bcrypt]>=1.7.4", "bcrypt<4.1"]
cache = ["redis>=5.0"]
events = ["confluent-kafka>=2.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailpulse_common*"]
