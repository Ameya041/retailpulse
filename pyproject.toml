# Repo-wide tooling configuration. Each service keeps its own runtime
# dependencies; linting and formatting rules are shared so every service reads
# the same way.

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated migrations are Alembic's output, not hand-written code -- style
# rules on them just create churn on every `alembic revision --autogenerate`.
exclude = [".venv", "**/alembic/versions", "node_modules", "frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear -- catches mutable defaults, unused loop vars
    "UP",   # pyupgrade
    "C4",   # comprehension simplifications
    "SIM",  # obvious simplifications
    "ARG",  # unused arguments
    "S",    # bandit security checks
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
    "S104",   # binding 0.0.0.0 is correct inside a container
    # `class X(str, Enum)` rather than `StrEnum`: these enums are stored in
    # VARCHAR columns and compared against raw strings loaded from the database,
    # where the explicit `str` mixin makes that contract obvious at the
    # definition site.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on hardcoded credentials and use assert freely -- that is the point.
# ARG005/B017: stub callables and broad `pytest.raises` are normal in tests.
"**/tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002", "ARG005", "B017"]
# Event handlers all share one signature so the worker can dispatch on a plain
# lookup table. Some handlers legitimately do not publish anything, but the
# parameter has to stay for the signature to be uniform.
"**/handlers.py" = ["ARG001"]
"scripts/*" = ["S310"]
# A load generator picks random products and quantities. S311 flags `random`
# as unsuitable for cryptography, which is true and irrelevant here -- nothing
# in a load test is a secret.
"load-tests/*" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "retailpulse_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
