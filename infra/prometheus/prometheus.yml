# Prometheus scrape configuration.
#
# Every service exposes /metrics through the shared observability middleware,
# so the scrape config is uniform: one job per service, same path, same
# interval.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: retailpulse

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: retailpulse-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000
          - product-service:8001
          - inventory-service:8002
          - order-service:8003
          - user-service:8004
          - payment-service:8005
          - fulfilment-service:8006
          - analytics-service:8007
          - ml-service:8008
    relabel_configs:
      # Turn "product-service:8001" into a clean `service` label, so dashboards
      # and alerts group by service name rather than host:port.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "$1"
