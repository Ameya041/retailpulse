# nginx config for the built React app.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app owns its own routing. Without this, a browser refresh
    # on /orders/abc asks nginx for a file that does not exist and gets a 404 --
    # the classic "works until you hit reload" bug.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely. index.html must never be cached, or a browser keeps
    # loading the old app after a deploy and requests assets that are gone.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy the API to the gateway so the browser sees a single origin and CORS
    # never applies. This mirrors the Vite dev proxy, which keeps development
    # and production shaped the same.
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for the gateway's own upstream timeout to fire first, so
        # the client gets the gateway's clean 503 rather than a dropped
        # connection from nginx.
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # Defence in depth. The app is same-origin and does not embed anything, so
    # these cost nothing and close off whole classes of attack.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
